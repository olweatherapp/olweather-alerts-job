# Builds the two official-alerts files every 5 minutes and writes them to Cloudflare KV. No visitor ever reaches GitHub.
# Security: no pull_request trigger (a fork can never run this or read the secrets), the built-in GITHUB_TOKEN has no rights,
# every action is pinned to a full commit, nothing is installed from npm (the KV write is a plain HTTPS call), secrets are only read by the
# one step that needs them, and the cache holds public zone shapes only.
name: alerts-snapshot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: alerts-snapshot
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.12'
      - name: Restore the zone and SACHET shape cache (public data only)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684   # v4.2.3
        with:
          path: alerts-cache
          key: alerts-cache-${{ github.run_id }}
          restore-keys: alerts-cache-
      - name: Build both files (one pass over NOAA, MET Norway and SACHET)
        env:
          ALERTS_USER_AGENT: OLWeather-alerts/1.0 (+https://olweather.com/contact)
        run: python alerts-snapshot-build.py --out alerts-compact.json --out-full alerts-full.json
      - name: Write to Cloudflare KV
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV: ${{ secrets.EARTHLENS_KV_NAMESPACE_ID }}
        run: |
          set +x
          for pair in "alerts-compact:alerts-compact.json" "alerts:alerts-full.json"; do
            key="${pair%%:*}"; file="${pair#*:}"
            curl -sS --fail-with-body --proto '=https' --tlsv1.2 -X PUT \
              -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
              --data-binary "@${file}" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/storage/kv/namespaces/${CF_KV}/values/${key}" > /dev/null
          done
